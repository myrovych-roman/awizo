{% extends "base.html" %}

{% block title %}Settings{% endblock %}

{% block content %}
<h2>Налаштування</h2>
<form>
    <div class="mb-3">
        <label for="language" class="form-label">Мова</label>
        <select class="form-select" id="language">
            <option value="uk">Українська</option>
            <option value="pl">Polski</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Поля для відображення в пошуку</label>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="car_number_check" checked>
            <label class="form-check-label" for="car_number_check">
                Номер авто
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="driver_name_check" checked>
            <label class="form-check-label" for="driver_name_check">
                Водій
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="firm_name_check" checked>
            <label class="form-check-label" for="firm_name_check">
                Фірма
            </label>
        </div>
         <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="date_time_check" checked>
            <label class="form-check-label" for="date_time_check">
                Дата/Час
            </label>
        </div>
         <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="type_check" checked>
            <label class="form-check-label" for="type_check">
                Тип
            </label>
        </div>
         <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="status_check" checked>
            <label class="form-check-label" for="status_check">
                Статус
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="comment_check" checked>
            <label class="form-check-label" for="comment_check">
                Коментар
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="user_check" checked>
            <label class="form-check-label" for="user_check">
                Створив
            </label>
        </div>
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="print_button">
        <label class="form-check-label" for="print_button">Увімкнути кнопку друку</label>
    </div>
    <button type="submit" class="btn btn-primary">Зберегти</button>
</form>
{% endblock %}
